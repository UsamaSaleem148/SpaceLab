<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B10" />
    <!-- Title, description, Open Graph, Twitter Card, canonical and JSON-LD are
         written at build time from src/seo/site.ts (see vite.config.ts). -->
    <title>SpaceLab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <!-- Static, crawlable page content. React renders the interactive globe and
         panels into #root and never replaces these elements. -->
    <header
      class="pointer-events-none fixed inset-x-0 top-0 z-20 bg-gradient-to-b from-bg/90 via-bg/60 to-transparent pt-[env(safe-area-inset-top)] pb-6 [text-shadow:0_1px_8px_rgb(11_11_16/0.8)]"
    >
      <div class="flex min-h-14 items-center gap-2.5 px-4 sm:min-h-16 sm:px-6">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true" class="shrink-0">
          <circle cx="16" cy="16" r="6" fill="var(--color-accent)" />
          <ellipse
            cx="16"
            cy="16"
            rx="13"
            ry="5.5"
            fill="none"
            stroke="var(--color-text)"
            stroke-opacity="0.85"
            stroke-width="1.5"
            transform="rotate(-25 16 16)"
          />
          <circle cx="27.3" cy="11.2" r="1.9" fill="var(--color-highlight)" />
        </svg>
        <h1 class="pointer-events-auto leading-tight">
          <span class="block text-[17px] font-semibold tracking-tight text-text">
            Space<span class="font-normal text-text-muted">Lab</span>
          </span>
          <span class="sr-only"> — </span>
          <span class="block text-[11px] font-medium tracking-[0.06em] text-text-muted uppercase">
            Live ISS Tracker
          </span>
        </h1>
      </div>
    </header>

    <div id="root"></div>

    <footer
      id="site-footer"
      class="fixed inset-x-4 bottom-[calc(2.5rem+env(safe-area-inset-bottom))] z-20 space-y-0.5 text-xs leading-relaxed text-text-muted [text-shadow:0_1px_6px_rgb(11_11_16/0.95)] sm:inset-x-auto sm:left-6 sm:max-w-xs"
    >
      <p>Live ISS position, altitude, speed and orbit predictions on an interactive 3D globe.</p>
      <p>
        Built by
        <a
          href="https://usamadev.com"
          target="_blank"
          rel="noopener noreferrer"
          class="font-medium text-text underline decoration-text-muted/50 underline-offset-2 transition-colors duration-200 hover:decoration-accent-text focus-visible:rounded-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >Muhammad Usama Saleem<span class="sr-only"> (opens in a new tab)</span></a
        >
      </p>
    </footer>

    <noscript>
      <p class="fixed inset-x-4 top-1/2 z-30 -translate-y-1/2 text-center text-sm text-text-muted">
        SpaceLab needs JavaScript and WebGL to show the live 3D globe.
      </p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
